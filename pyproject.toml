[project]
name = "evalgate"
version = "0.1.0"
description = "A regression gate for LLM-powered features."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31,<4",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
evalgate = "evalgate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real LLM provider and costs money; run with `pytest -m live`"]
